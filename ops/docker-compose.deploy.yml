services:
  gateway:
    image: ${IMAGE_TAG}
    container_name: atenea-gateway
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:8000"
    env_file: .env.${DEPLOY_ENV:-production}
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.production
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/')"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    networks:
      - crm

networks:
  crm:
    name: crm-${DEPLOY_ENV:-production}
    external: true
